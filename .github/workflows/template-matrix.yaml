name: Template Matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run template invariants
        run: ./workflow.cmd test.invariants

  list-combos:
    name: List matrix combos
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.combos.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Emit combos as JSON
        id: combos
        run: echo "combos=$(./workflow.cmd test.list-combos --as-json)" >> "$GITHUB_OUTPUT"

  combo:
    name: QA ${{ matrix.cell.label }}
    needs: list-combos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.list-combos.outputs.combos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Run combo QA
        run: >-
          ./workflow.cmd test.combo
          --git-hosting-service ${{ matrix.cell.git_hosting_service }}
          --integrate-dependency-track ${{ matrix.cell.integrate_dependency_track }}
          --integrate-pages ${{ matrix.cell.integrate_pages }}
